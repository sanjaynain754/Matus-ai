name: Matus AI Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3-pip \
            python3-venv \
            openjdk-17-jdk \
            zipalign \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            ccache \
            cmake \
            ninja-build

      - name: Install Python Dependencies
        run: |
          pip install buildozer==1.5.0 cython==0.29.33

      - name: Install Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/33.0.2
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Verify Configuration
        run: |
          echo "=== Python Version ==="
          python3 --version
          echo "=== Java Version ==="
          java -version 2>&1 | head -1
          echo "=== buildozer.spec ==="
          cat buildozer.spec | grep -E "requirements|p4a|android"
          echo "=== Source Files ==="
          ls -la main.py datya_core.py datya_hacking.py datya_web.py datya_admin.py datya_auto.py datya_mythos.py icon.png
          python3 -c "from datya_core import get_datya; print('All imports OK')"

      - name: Build APK
        run: buildozer -v android debug
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MatusAI-APK
          path: bin/*.apk
          if-no-files-found: error
