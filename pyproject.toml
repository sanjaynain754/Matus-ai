[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "matufs-ai_models"
version = "0.2.0"
authors = [
    {name = "Meta Matufs AI", email = "matufs-ai-oss@meta.com"},
]
description = "Matufs AI models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML",
    "jinja2>=3.1.6",
    "tiktoken",
    "pydantic>=2",
    "Pillow",
    "rich",
    "httpx",
    "termcolor",
    "huggingface-hub",
]
classifiers = []

[project.urls]
Homepage = "https://github.com/meta-matufs-ai/matufs-ai-models"

[project.scripts]
matufs-ai-model = "matufs-ai_models.cli.matufs-ai:main"
multimodal_example_chat_completion = "matufs-ai_models.scripts.multimodal_example_chat_completion:main"
multimodal_example_text_completion = "matufs-ai_models.scripts.multimodal_example_text_completion:main"
example_chat_completion = "matufs-ai_models.scripts.example_chat_completion:main"
example_text_completion = "matufs-ai_models.scripts.example_text_completion:main"
matufs-ai4_completion = "matufs-ai_models.matufs-ai4.scripts.completion:main"
matufs-ai4_chat_completion = "matufs-ai_models.matufs-ai4.scripts.chat_completion:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
    "mypy",
    "ruff",
]
torch = [
    "torch",
    "torchvision",
    "fairscale",
    "fire",
    "blobfile",
    "fbgemm-gpu-genai==1.1.2",
]

[tool.setuptools]
package-dir = {"matufs-ai_models" = "matufs-ai_models"}
packages = {find = {}}
